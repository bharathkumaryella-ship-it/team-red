name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-and-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: src/frontend
        run: npm ci && npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit backend dependencies
        run: python -m pip install pip-audit && pip-audit -r src/backend/requirements.txt
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          artifact-name: medidesk-sbom.spdx.json
      - name: Build images
        run: docker compose build
      - name: Scan images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: buildsecure-backend:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: buildsecure-frontend:latest
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
