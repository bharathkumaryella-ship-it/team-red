[project]
name = "medidesk"
version = "1.0.0"
description = "MediDesk Flask Backend"
requires-python = ">=3.12,<3.15"

dependencies = [
    "Flask>=3.1,<4",
    "Flask-Cors>=5,<6",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-Limiter>=3.5,<4",
    "redis>=5,<6",
    "PyMySQL>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "python-dotenv>=1,<2",
    "argon2-cffi>=23,<24",
    "cryptography>=45,<50"
]

[tool.vercel]
entrypoint = "run:app"